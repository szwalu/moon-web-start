<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>正在跳转...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // 只要访问路径是以 /jmsp 开头，一律秒跳新二级域名
      if (path === '/jmsp' || path.startsWith('/jmsp/')) {
        window.location.replace('https://jmsp.woabc.com/' + search + hash);
      }
    })();
  </script>
</head>
<body></body>
</html>
