<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在连接 OneDrive...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
      color: #333;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <p id="msg">正在跳转回 App，请稍候...</p>
  <script>
    // 跟 google_callback.html / baidu_callback.html 是同一套模式：从这个页面自己的
    // URL 查询参数里取出 code，转发成 App 里 appUrlOpen 监听器能接住的
    // trifles://auth?... 深链接。platform=onedrive 这个参数是 App 侧用来区分
    // 三个网盘回调、决定 dispatch 哪个 xxx_code_received 事件的关键。
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    var errorDescription = params.get('error_description');

    if (code) {
      window.location.href = 'trifles://auth?platform=onedrive&code=' + encodeURIComponent(code);
    } else {
      document.getElementById('msg').textContent =
        '授权失败：' + (errorDescription || error || '未知错误') + '，请返回 App 重试。';
    }
  </script>
</body>
</html>
