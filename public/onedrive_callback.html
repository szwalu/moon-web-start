<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在连接 OneDrive...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
      color: #333;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    /* 增加手动跳转按钮的样式 */
    .fallback-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      background-color: #007aff;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 16px;
      box-shadow: 0 2px 4px rgba(0, 122, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="container">
    <p id="msg">正在跳转回 App，请稍候...</p>
  </div>
  
  <script>
    // 跟 google_callback.html / baidu_callback.html 是同一套模式：从这个页面自己的
    // URL 查询参数里取出 code，转发成 App 里 appUrlOpen 监听器能接住的
    // trifles://auth?... 深链接。platform=onedrive 这个参数是 App 侧用来区分
    // 三个网盘回调、决定 dispatch 哪个 xxx_code_received 事件的关键。
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    var errorDescription = params.get('error_description');

    if (code) {
      var deepLink = 'trifles://auth?platform=onedrive&code=' + encodeURIComponent(code);
      
      // 1. 尝试自动跳转
      window.location.href = deepLink;

      // 2. 增加安卓兜底方案：如果因为安卓系统安全策略/WebView拦截导致页面 1.5 秒后仍未关闭，显示手动跳转按钮
      setTimeout(function() {
        var msgEl = document.getElementById('msg');
        // 只有当提示信息还是默认内容时，才做更新（防止覆盖错误信息）
        if (msgEl.textContent.indexOf('正在跳转') !== -1) {
          msgEl.innerHTML = '如果未能自动跳转，请手动点击下方按钮：';
          
          // 创建并插入按钮
          var btn = document.createElement('a');
          btn.href = deepLink;
          btn.className = 'fallback-btn';
          btn.textContent = '返回 App';
          document.getElementById('container').appendChild(btn);
        }
      }, 1500);

    } else {
      document.getElementById('msg').textContent =
        '授权失败：' + (errorDescription || error || '未知错误') + '，请返回 App 重试。';
    }
  </script>
</body>
</html>
