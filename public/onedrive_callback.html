<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在连接 OneDrive...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
      color: #333;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #fallback {
      /* ✨ 修复安卓白屏卡住：默认隐藏，脚本里延迟一小段时间后才展示，
         给自动跳转（iOS 上几乎瞬间就会离开这个页面）留出窗口，避免这个
         按钮在正常场景下也一闪而过地被用户看到 */
      display: none;
      margin-top: 22px;
      flex-direction: column;
      align-items: center;
    }
    #fallback.show { display: flex; }
    #fallback p {
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #888;
    }
    #fallback a {
      display: inline-block;
      background: #0078D4;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 28px;
      border-radius: 10px;
    }
    #fallback a:active { opacity: 0.85; }
  </style>
</head>
<body>
  <p id="msg">正在跳转回 App，请稍候...</p>

  <!-- ✨ 修复安卓白屏卡住：安卓 Chrome / Custom Tabs 对"页面脚本自动发起的
       自定义协议跳转"（没有紧跟在一次真实点击后面）经常会直接静默拦截，
       既不跳转、也不报错，导致停留在这个页面上白屏卡住——iOS 的 Safari /
       SFSafariViewController 则没有这个限制，脚本自动跳转能正常生效，
       这就是为什么现象只在安卓上出现。这里保留原有的脚本自动跳转（对 iOS
       和部分安卓机型仍然是最快的路径），同时新增一个真实的 <a> 标签兜底——
       一次真实的点击本身就是浏览器认可的"用户主动发起"，安卓上基本总能
       成功唤起 App，用来兜底脚本跳转被拦截的情况。 -->
  <div id="fallback">
    <p>没有自动跳转？点击下方按钮返回 App</p>
    <a id="fallback-link" href="#">返回 App 完成授权</a>
  </div>

  <script>
    // 跟 google_callback.html / baidu_callback.html 是同一套模式：从这个页面自己的
    // URL 查询参数里取出 code，转发成 App 里 appUrlOpen 监听器能接住的
    // trifles://auth?... 深链接。platform=onedrive 这个参数是 App 侧用来区分
    // 三个网盘回调、决定 dispatch 哪个 xxx_code_received 事件的关键。
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    var errorDescription = params.get('error_description');

    if (code) {
      var deepLink = 'trifles://auth?platform=onedrive&code=' + encodeURIComponent(code);

      // 1. 脚本自动跳转：iOS 上几乎总能立刻生效，这个页面根本不会被用户看到；
      //    部分安卓机型/浏览器也认，能跳就跳，跳不了不会报错、只是静默无效果。
      window.location.href = deepLink;

      // 2. 兜底按钮：把同一个深链接绑到一个真实的 <a> 标签上，延迟 600ms 后
      //    才显示——这样自动跳转成功的场景里（iOS、以及部分安卓）用户几乎不会
      //    看到这个按钮一闪而过；如果 600ms 后页面还停在这里，说明自动跳转
      //    大概率被拦截了，这时候按钮出现，用户点一下（真实点击手势）基本总能
      //    唤起 App，不会再卡在白屏上。
      document.getElementById('fallback-link').href = deepLink;
      setTimeout(function () {
        document.getElementById('fallback').className = 'show';
      }, 600);
    } else {
      document.getElementById('msg').textContent =
        '授权失败：' + (errorDescription || error || '未知错误') + '，请返回 App 重试。';
    }
  </script>
</body>
</html>
