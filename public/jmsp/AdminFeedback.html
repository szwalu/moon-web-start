<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>鸡毛蒜皮 - 管理后台</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; height: 100dvh; display: flex; flex-direction: column; color: #333; }
        
        /* 登录遮罩 */
        .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .login-box { background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); text-align: center; }
        .login-box h3 { margin-bottom: 20px; color: #333; }
        .login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-size: 15px; outline: none; transition: border 0.2s; }
        .login-box input:focus { border-color: #007aff; }
        .login-box button { width: 100%; padding: 12px; background: #007aff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: background 0.2s; }
        .login-box button:hover:not(:disabled) { background: #0056b3; }
        .login-box button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-tip { color: #ff3b30; font-size: 13px; margin-bottom: 12px; text-align: left; }

        /* 主体布局 */
        .admin-container { display: flex; flex: 1; height: 100dvh; overflow: hidden; }
        .device-list { width: 320px; background: #fff; border-right: 1px solid #e5e5e5; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .device-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; border-radius: 8px; margin-bottom: 6px; transition: background 0.2s; }
        .device-item:hover { background: #f9fafb; }
        .device-item.active { background: #eef2ff; border-bottom-color: transparent; }
        .dev-id { font-weight: 600; font-size: 14px; color: #111; }
        .dev-preview { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 6px; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
        .chat-header { padding: 15px; border-bottom: 1px solid #e5e5e5; font-weight: bold; background: #f9fafb; font-size: 14px; color: #333; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .header-left span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 移动端专属返回按钮 */
        .mobile-back-btn { display: none; background: none; border: none; color: #007aff; font-size: 15px; font-weight: 600; cursor: pointer; padding: 4px 8px 4px 0; }
        
        .logout-btn { background: #ff3b30; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .delete-btn { background: #ff9500; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        
        .message-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #f5f6f8; }
        .msg-row { display: flex; width: 100%; }
        .user-msg { justify-content: flex-start; }
        .admin-msg { justify-content: flex-end; }
        .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .user-msg .bubble { background: #fff; color: #333; border: 1px solid #e5e5e5; border-top-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .admin-msg .bubble { background: #007aff; color: #fff; border-top-right-radius: 4px; box-shadow: 0 1px 2px rgba(0,122,255,0.2); }
        .role-tag { font-size: 11px; opacity: 0.7; display: block; margin-bottom: 4px; }
        
        .send-box { padding: 12px 16px; border-top: 1px solid #e5e5e5; display: flex; gap: 12px; background: #fff; align-items: flex-end; }
        .send-box textarea { flex: 1; min-height: 44px; max-height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 22px; resize: none; font-size: 14px; outline: none; background: #f9fafb; transition: border 0.2s; }
        .send-box textarea:focus { border-color: #007aff; background: #fff; }
        .send-box button { padding: 0 20px; height: 44px; background: #007aff; color: #fff; border: none; border-radius: 22px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
        .send-box button:hover { background: #0056b3; }
        .no-select { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 15px; background: #f5f6f8; }

        /* ====== 移动端适配 ====== */
        @media (max-width: 768px) {
            .device-list { width: 100%; border-right: none; }
            .chat-area { width: 100%; }
            /* 如果选中了设备，隐藏列表，显示聊天；否则反之 */
            .admin-container.has-device .device-list { display: none; }
            .admin-container:not(.has-device) .chat-area { display: none; }
            .mobile-back-btn { display: inline-block; }
            /* iOS 防自动放大 */
            .login-box input, .send-box textarea { font-size: 16px; }
            .bubble { max-width: 85%; }
            .header-left span { font-size: 13px; }
            .chat-header { padding: 12px; }
            .delete-btn, .logout-btn { padding: 6px 8px; font-size: 11px; }
        }

        /* ====== 黑暗模式适配 ====== */
        @media (prefers-color-scheme: dark) {
            body { background: #121212; color: #e5e5e5; }
            
            /* 登录框 */
            .login-box { background: #1e1e1e; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
            .login-box h3 { color: #f5f5f5; }
            .login-box input { background: #2c2c2c; border: 1px solid #444; color: #f5f5f5; }
            .login-box input:focus { border-color: #0a84ff; }
            
            /* 主界面 */
            .device-list { background: #181818; border-right-color: #333; }
            .device-list h3 { color: #e5e5e5 !important; }
            .device-item { border-bottom-color: #2c2c2c; }
            .device-item:hover { background: #242424; }
            .device-item.active { background: #2c3344; }
            .dev-id { color: #f5f5f5; }
            .dev-preview { color: #aaa; }
            
            /* 聊天区域 */
            .chat-area { background: #121212; }
            .chat-header { background: #1e1e1e; border-bottom-color: #333; color: #e5e5e5; }
            .message-box { background: #121212; }
            
            /* 气泡 */
            .user-msg .bubble { background: #242424; color: #e5e5e5; border-color: #333; }
            .admin-msg .bubble { background: #0a84ff; color: #fff; }
            
            /* 输入框 */
            .send-box { background: #1e1e1e; border-top-color: #333; }
            .send-box textarea { background: #2c2c2c; border-color: #444; color: #f5f5f5; }
            .send-box textarea:focus { background: #242424; border-color: #0a84ff; }
            .no-select { background: #121212; color: #666; }
            
            /* 滚动条美化（黑暗模式下更协调） */
            ::-webkit-scrollbar { width: 6px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
            ::-webkit-scrollbar-thumb:hover { background: #666; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Supabase 账号登录遮罩 -->
    <div v-if="!isLoggedIn" class="login-overlay">
        <div class="login-box">
            <h3>管理员登录</h3>
            <div v-if="loginError" class="error-tip">{{ loginError }}</div>
            <input type="email" v-model="email" placeholder="输入管理员邮箱..." @keyup.enter="handleLogin">
            <input type="password" v-model="password" placeholder="输入密码..." @keyup.enter="handleLogin">
            <button @click="handleLogin" :disabled="loading">{{ loading ? '登录中...' : '登 录' }}</button>
        </div>
    </div>

    <!-- 管理后台主体：使用 :class 控制移动端单页显示状态 -->
    <div class="admin-container" :class="{ 'has-device': !!currentDevice }" v-else>
        
        <!-- 左侧：用户设备列表 -->
        <div class="device-list">
            <h3 style="margin-bottom: 16px; font-size: 16px;">反馈用户列表</h3>
            <div style="flex:1; overflow-y:auto; padding-right:4px;">
                <div 
                    v-for="item in devices" 
                    :key="item.device_id"
                    class="device-item"
                    :class="{ active: currentDevice === item.device_id }"
                    @click="selectDevice(item.device_id)"
                >
                    <div class="dev-id">设备: {{ item.device_id }}</div>
                    <div class="dev-preview">{{ item.content }}</div>
                </div>
            </div>
        </div>

        <!-- 右侧：聊天与回复 -->
        <div class="chat-area">
            <template v-if="currentDevice">
                <div class="chat-header">
                    <div class="header-left">
                        <button class="mobile-back-btn" @click="currentDevice = null">← 返回</button>
                        <span>{{ currentDevice }}</span>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button class="delete-btn" @click="deleteDeviceThread(currentDevice)">清空会话</button>
                        <button class="logout-btn" @click="handleLogout">退出</button>
                    </div>
                </div>
                
                <div class="message-box" ref="messageBoxRef">
                    <div 
                        v-for="msg in messages" 
                        :key="msg.id"
                        class="msg-row"
                        :class="msg.sender_role === 'admin' ? 'admin-msg' : 'user-msg'"
                    >
                        <div class="bubble">
                            <span class="role-tag">{{ msg.sender_role === 'admin' ? '我（管理员）' : '用户反馈' }}</span>
                            <div v-if="parseMessage(msg.content).text">{{ parseMessage(msg.content).text }}</div>
                            <div v-if="parseMessage(msg.content).images.length" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
                                <img
                                    v-for="(url, i) in parseMessage(msg.content).images"
                                    :key="i"
                                    :src="url"
                                    style="width:100px; height:100px; object-fit:cover; border-radius:8px; cursor:pointer;"
                                    @click="openImage(url)"
                                >
                            </div>
                            <button
                                @click="deleteMessage(msg)"
                                style="margin-top:8px; background:none; border:none; color:#999; font-size:12px; cursor:pointer; padding:0; transition: color 0.2s;"
                                onmouseover="this.style.color='#ff3b30'"
                                onmouseout="this.style.color='#999'"
                            >删除该条记录</button>
                        </div>
                    </div>
                </div>

                <div class="send-box">
                    <textarea 
    v-model="replyText" 
    placeholder="输入回复内容..."
    @keyup.enter.exact.prevent="sendReply"
    @focus="handleInputFocus"
    @blur="handleInputBlur"
></textarea>
                    <button @click="sendReply">发 送</button>
                </div>
            </template>
            <template v-else>
                <div class="no-select">
                    <!-- 移动端显示顶部导航，方便退出 -->
                    <div class="chat-header" style="position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; background: transparent; border: none;">
                        <button class="logout-btn" @click="handleLogout" style="display: none;" id="mobile-logout">退出登录</button>
                    </div>
                    请在左侧选择一个用户的反馈进行查看和回复
                </div>
            </template>
        </div>
    </div>
</div>

<script>
const { createApp, ref, onMounted, nextTick } = Vue

// ====== 请在这里配置你的 Supabase 信息 ======
const SUPABASE_URL = 'https://reikfzpaefbbokwwocdr.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaWtmenBhZWZiYm9rd3dvY2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkyNTM3ODcsImV4cCI6MjA2NDgyOTc4N30.E2qEwZWZO3ckVkqq9hzmDxrQK61MonUDOpCqUJpzhCQ'

// 🌟 新增：管理员邮箱白名单（请填入你自己的真实管理员邮箱）
const ALLOWED_ADMIN_EMAILS = [
    'ming@woabc.com', // 替换为你的邮箱
    'another_admin@example.com' 
]
// ===========================================

createApp({
    setup() {
        const isLoggedIn = ref(false)
        const email = ref('')
        const password = ref('')
        const loginError = ref('')
        const loading = ref(false)
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        
        const devices = ref([])
        const currentDevice = ref(null)
        const messages = ref([])
        const replyText = ref('')
        const messageBoxRef = ref(null)

        // 🌟 修改：页面加载时，自动登录也需要校验白名单
        onMounted(async () => {
            const { data: { session } } = await supabaseClient.auth.getSession()
            if (session) {
                // 校验邮箱是否在白名单中
                if (ALLOWED_ADMIN_EMAILS.includes(session.user.email)) {
                    isLoggedIn.value = true
                    initData()
                } else {
                    // 如果非管理员缓存了登录态，静默登出
                    await supabaseClient.auth.signOut()
                }
            }
            
            // 响应式处理注销按钮在手机列表页的展示
            window.addEventListener('resize', () => {
                const btn = document.getElementById('mobile-logout');
                if (btn) btn.style.display = window.innerWidth <= 768 ? 'block' : 'none';
            })
            setTimeout(() => {
                const btn = document.getElementById('mobile-logout');
                if (btn) btn.style.display = window.innerWidth <= 768 ? 'block' : 'none';
            }, 100);

            // 🌟 新增：用 visualViewport 精确处理键盘弹出时的布局
            if (window.visualViewport) {
                const vv = window.visualViewport
                const container = document.querySelector('.admin-container')
                const handleViewportResize = () => {
                    if (container) {
                        container.style.height = vv.height + 'px'
                    }
                    window.scrollTo(0, 0)
                    scrollToBottom()
                }
                vv.addEventListener('resize', handleViewportResize)
                vv.addEventListener('scroll', handleViewportResize)
            }
        })

        // 🌟 修改：登录接口校验逻辑
        const handleLogin = async () => {
            if (!email.value || !password.value) {
                loginError.value = '请输入邮箱和密码'
                return
            }
            loading.value = true
            loginError.value = ''

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email.value,
                password: password.value,
            })

            loading.value = false

            if (error) {
                loginError.value = '登录失败: ' + error.message
            } else {
                // 登录成功后，校验该用户邮箱是否有权限
                if (ALLOWED_ADMIN_EMAILS.includes(data.user.email)) {
                    isLoggedIn.value = true
                    initData()
                } else {
                    loginError.value = '权限不足：该账号不是管理员'
                    // 强制将非法账号登出
                    await supabaseClient.auth.signOut()
                }
            }
        }

        const handleLogout = async () => {
            await supabaseClient.auth.signOut()
            isLoggedIn.value = false
            currentDevice.value = null
            email.value = ''
            password.value = ''
        }

        const initData = () => {
            fetchDevices()
            supabaseClient
                .channel('admin-web-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ticket_messages' }, payload => {
                    const newMsg = payload.new
                    if (currentDevice.value === newMsg.device_id) {
                        messages.value.push(newMsg)
                        scrollToBottom()
                    }
                    fetchDevices()
                })
                .subscribe()
        }

        const fetchDevices = async () => {
            const { data, error } = await supabaseClient
                .from('ticket_messages')
                .select('device_id, created_at, content')
                .order('created_at', { ascending: false })

            if (!error && data) {
                const map = new Map()
                data.forEach(item => {
                    if (!map.has(item.device_id)) {
                        map.set(item.device_id, item)
                    }
                })
                devices.value = Array.from(map.values())
            }
        }

        const selectDevice = async (deviceId) => {
            currentDevice.value = deviceId
            const { data, error } = await supabaseClient
                .from('ticket_messages')
                .select('*')
                .eq('device_id', deviceId)
                .order('created_at', { ascending: true })

            if (!error && data) {
                messages.value = data
                scrollToBottom()
            }
        }

        const sendReply = async () => {
            if (!replyText.value.trim() || !currentDevice.value) return

            const content = replyText.value.trim()
            const { error } = await supabaseClient
                .from('ticket_messages')
                .insert([{
                    device_id: currentDevice.value,
                    sender_role: 'admin',
                    content: content
                }])

            if (error) {
                alert('发送失败: ' + error.message)
                return
            }

            replyText.value = ''
            scrollToBottom()
        }

        const scrollToBottom = () => {
            nextTick(() => {
                if (messageBoxRef.value) {
                    messageBoxRef.value.scrollTop = messageBoxRef.value.scrollHeight
                }
            })
        }

        // 处理键盘弹出时的错位
        const handleInputFocus = () => {
            nextTick(scrollToBottom)
        }
        const handleInputBlur = () => {
            if (window.visualViewport) {
                document.querySelector('.admin-container').style.height = ''
            }
            window.scrollTo(0, 0)
        }

        const parseMessage = (content) => {
            if (!content) return { text: '', images: [] }
            const marker = '【附图】：'
            const idx = content.indexOf(marker)
            if (idx === -1) return { text: content, images: [] }
            const text = content.slice(0, idx).trim()
            const images = content
                .slice(idx + marker.length)
                .split('\n')
                .map(s => s.trim())
                .filter(s => s.startsWith('http'))
            return { text, images }
        }

        const openImage = (url) => {
            window.open(url, '_blank')
        }

        const extractStoragePath = (url) => {
            const marker = '/public/feedback-images/'
            const idx = url.indexOf(marker)
            if (idx === -1) return null
            return url.slice(idx + marker.length)
        }

        const deleteMessage = async (msg) => {
            if (!confirm('确定要删除这条消息吗？此操作不可撤销。')) return

            const { images } = parseMessage(msg.content)
            if (images.length > 0) {
                const paths = images.map(extractStoragePath).filter(Boolean)
                if (paths.length > 0) {
                    const { error: storageError } = await supabaseClient.storage
                        .from('feedback-images')
                        .remove(paths)
                    if (storageError) {
                        console.error('图片删除失败:', storageError)
                    }
                }
            }

            const { error } = await supabaseClient
                .from('ticket_messages')
                .delete()
                .eq('id', msg.id)

            if (error) {
                alert('删除失败: ' + error.message)
                return
            }

            messages.value = messages.value.filter(m => m.id !== msg.id)
        }

        const deleteDeviceThread = async (deviceId) => {
            if (!confirm(`确定要删除设备 ${deviceId} 的全部反馈记录吗？此操作不可撤销。`)) return

            const { data: msgsToDelete } = await supabaseClient
                .from('ticket_messages')
                .select('content')
                .eq('device_id', deviceId)

            const allPaths = []
            ;(msgsToDelete || []).forEach(m => {
                const { images } = parseMessage(m.content)
                images.forEach(url => {
                    const path = extractStoragePath(url)
                    if (path) allPaths.push(path)
                })
            })

            if (allPaths.length > 0) {
                await supabaseClient.storage.from('feedback-images').remove(allPaths)
            }

            const { error } = await supabaseClient
                .from('ticket_messages')
                .delete()
                .eq('device_id', deviceId)

            if (error) {
                alert('删除失败: ' + error.message)
                return
            }

            if (currentDevice.value === deviceId) {
                currentDevice.value = null
                messages.value = []
            }
            fetchDevices()
        }
        
        return {
            isLoggedIn,
            email,
            password,
            loginError,
            loading,
            handleLogin,
            handleLogout,
            devices,
            currentDevice,
            messages,
            replyText,
            selectDevice,
            sendReply,
            messageBoxRef,
            parseMessage,
            openImage,
            deleteMessage,
            deleteDeviceThread,
            handleInputFocus,
            handleInputBlur
        }
    }
}).mount('#app')
</script>

</body>
</html>
