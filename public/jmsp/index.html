<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 1. 搜索引擎与浏览器底层 0 秒瞬时重定向 -->
  <meta http-equiv="refresh" content="0; url=https://jmsp.woabc.com/">
  <link rel="canonical" href="https://jmsp.woabc.com/">
  <title>正在跳转到新官网...</title>
  <script>
    // 2. JS 兜底快速替换当前页面，自动携带旧链接的参数与哈希
    var search = window.location.search;
    var hash = window.location.hash;
    window.location.replace("https://jmsp.woabc.com/" + search + hash);
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 50px; font-family: sans-serif; color: #666;">
    页面正在迁移，正在为您跳转至全新官网：<a href="https://jmsp.woabc.com/">jmsp.woabc.com</a>
  </p>
</body>
</html>
